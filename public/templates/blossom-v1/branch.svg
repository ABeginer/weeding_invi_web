<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400" fill="none">
  <defs>
    <radialGradient id="petal" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffe3ec"/>
      <stop offset="55%" stop-color="#f7a9bd"/>
      <stop offset="100%" stop-color="#d95d7b"/>
    </radialGradient>
    <radialGradient id="petal2" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fff1f5"/>
      <stop offset="60%" stop-color="#f4bfcd"/>
      <stop offset="100%" stop-color="#cf738b"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="blossom">
      <g filter="url(#soft)">
        <ellipse cx="0" cy="-22" rx="18" ry="27" fill="url(#petal)" transform="rotate(0)"/>
        <ellipse cx="0" cy="-22" rx="18" ry="27" fill="url(#petal)" transform="rotate(72)"/>
        <ellipse cx="0" cy="-22" rx="18" ry="27" fill="url(#petal)" transform="rotate(144)"/>
        <ellipse cx="0" cy="-22" rx="18" ry="27" fill="url(#petal)" transform="rotate(216)"/>
        <ellipse cx="0" cy="-22" rx="18" ry="27" fill="url(#petal)" transform="rotate(288)"/>
      </g>
      <circle r="9" fill="#f6c453"/>
      <circle cx="-4" cy="-3" r="2" fill="#d98a2b"/>
      <circle cx="4" cy="2" r="1.6" fill="#d98a2b"/>
      <circle cx="2" cy="-5" r="1.5" fill="#d98a2b"/>
    </g>
    <g id="bud">
      <ellipse cx="0" cy="0" rx="14" ry="22" fill="url(#petal2)" filter="url(#soft)"/>
      <path d="M0 -16 C8 -8 8 8 0 16" stroke="#c06078" stroke-width="1" opacity=".45"/>
    </g>
  </defs>

  <g opacity=".82" filter="url(#wash)">

    <path d="M60 -40 C160 140 170 300 230 450" stroke="#9b6f60" stroke-width="12" stroke-linecap="round" opacity=".14"/>
  </g>

  <g opacity=".94">
    <path d="M-50 110 C120 160 210 250 285 390 C345 505 435 575 585 625" stroke="#8c5d4c" stroke-width="9" stroke-linecap="round"/>
    <path d="M95 125 C70 215 40 300 -10 390" stroke="#8c5d4c" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 185 C230 215 275 225 335 235" stroke="#8c5d4c" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M245 315 C300 330 345 355 385 395" stroke="#8c5d4c" stroke-width="4" stroke-linecap="round"/>
    <path d="M330 465 C365 490 400 500 450 505" stroke="#8c5d4c" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M415 545 C445 585 475 605 520 620" stroke="#8c5d4c" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M520 610 C555 570 590 545 640 530" stroke="#8c5d4c" stroke-width="3" stroke-linecap="round"/>
    <path d="M115 118 C185 95 255 70 330 50" stroke="#8c5d4c" stroke-width="4" stroke-linecap="round" opacity=".8"/>

    <g transform="translate(105 125) rotate(-18)"><use href="#blossom" transform="scale(1.1)"/></g>
    <g transform="translate(150 190) rotate(15)"><use href="#blossom" transform="scale(.82)"/></g>
    <g transform="translate(210 240) rotate(32)"><use href="#blossom" transform="scale(.64)"/></g>
    <g transform="translate(270 300) rotate(-12)"><use href="#blossom" transform="scale(1.0)"/></g>
    <g transform="translate(345 350) rotate(18)"><use href="#blossom" transform="scale(.72)"/></g>
    <g transform="translate(390 440) rotate(-24)"><use href="#blossom" transform="scale(.9)"/></g>
    <g transform="translate(455 545) rotate(14)"><use href="#blossom" transform="scale(.7)"/></g>
    <g transform="translate(530 605) rotate(26)"><use href="#blossom" transform="scale(1.05)"/></g>
    <g transform="translate(620 610) rotate(-16)"><use href="#blossom" transform="scale(.7)"/></g>

    <g transform="translate(60 270) rotate(-30)"><use href="#bud"/></g>
    <g transform="translate(95 360) rotate(18)"><use href="#bud" transform="scale(.8)"/></g>
    <g transform="translate(220 215) rotate(70)"><use href="#bud" transform="scale(.7)"/></g>
    <g transform="translate(300 420) rotate(-45)"><use href="#bud" transform="scale(.9)"/></g>
    <g transform="translate(370 520) rotate(30)"><use href="#bud" transform="scale(.75)"/></g>
    <g transform="translate(480 590) rotate(-20)"><use href="#bud" transform="scale(.65)"/></g>
    <g transform="translate(560 555) rotate(55)"><use href="#bud" transform="scale(.8)"/></g>

    <g opacity=".55" transform="translate(250 690) rotate(22)"><use href="#blossom" transform="scale(.8)"/></g>
    <g opacity=".45" transform="translate(390 735) rotate(-12)"><use href="#blossom" transform="scale(.65)"/></g>
    <g opacity=".5" transform="translate(470 790) rotate(30)"><use href="#blossom" transform="scale(.72)"/></g>
    <path d="M250 660 C320 700 390 760 470 820" stroke="#9b6f60" stroke-width="3" opacity=".3" stroke-linecap="round"/>

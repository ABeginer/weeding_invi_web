<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8F7964" />
      <stop offset="50%" stop-color="#635242" />
      <stop offset="100%" stop-color="#8F7964" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="radialGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8F7964" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="640" fill="url(#bgGrad)" />
  <rect width="480" height="640" fill="url(#radialGlow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="440" height="600" rx="20" fill="none" stroke="rgba(143, 121, 100, 0.22)" stroke-width="2" />
  <rect x="28" y="28" width="424" height="584" rx="16" fill="none" stroke="rgba(143, 121, 100, 0.22)" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Center Card Area -->
  <rect x="56" y="80" width="368" height="480" rx="24" fill="#FFFFFF" stroke="rgba(143, 121, 100, 0.22)" stroke-width="1.5" />

  <!-- Top Badge -->
  <g transform="translate(240, 125)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="rgba(143, 121, 100, 0.08)" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#8F7964" letter-spacing="2">
      TINH KHÔI · REN THÊU
    </text>
  </g>

  <!-- Central Motif Icon -->
  <circle cx="240" cy="200" r="32" fill="rgba(143, 121, 100, 0.08)" stroke="rgba(143, 121, 100, 0.22)" stroke-width="1" />
  <path d="M240 188c-4 5-8 8-16 8 3 4 5 7 4 12 5-1 9 0 12 4 3-4 7-5 12-4-1-5 1-8 4-12-8 0-12-3-16-8z" fill="#8F7964" />

  <!-- Template Name -->
  <text x="240" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#8F7964">
    Ren Thêu Trắng
  </text>

  <!-- Divider Line -->
  <line x1="190" y1="305" x2="290" y2="305" stroke="rgba(143, 121, 100, 0.22)" stroke-width="1.5" />
  <circle cx="240" cy="305" r="3" fill="#8F7964" />

  <!-- Wedding Invitation Subtext -->
  <text x="240" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#6D6155" letter-spacing="3">
    THIỆP CƯỚI TRỰC TUYẾN
  </text>

  <!-- Sample Couple Names -->
  <text x="240" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#3A332C">
    Minh Khang &amp; Nhã Phương
  </text>

  <!-- Wedding Date -->
  <text x="240" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8F7964" letter-spacing="2">
    CHỦ NHẬT · 14 . 03 . 2027
  </text>

  <!-- Free Plan Pill -->
  <g transform="translate(240, 480)">
    <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#8F7964" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      GÓI MIỄN PHÍ
    </text>
  </g>
</svg>